# Weekly database backup, encrypted. The repo is public, so artifacts are downloadable by anyone:
# nothing leaves this job unencrypted. Restore steps: README → "Backups".
name: Database backup

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Add the SUPABASE_DB_URL secret (README → Backups)"; exit 1; }
          [ -n "$PASSPHRASE" ] || { echo "::error::Add the BACKUP_PASSPHRASE secret (README → Backups)"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" -f data.sql --use-copy --data-only

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tgz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" -o "backup-$(date -u +%F).tgz.gpg" backup.tgz
          rm -f roles.sql schema.sql data.sql backup.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup-*.tgz.gpg
          retention-days: 90
          if-no-files-found: error
